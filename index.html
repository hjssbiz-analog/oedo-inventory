<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>외도창고 재고관리</title>
<style>
:root { --ink:#172019; --green:#1f6a3d; --green-soft:#e7f2e9; --cream:#f6f3eb; --line:#e5e3dc; --muted:#747b74; }
* { box-sizing:border-box; }
body { margin:0; background:#eceae3; color:var(--ink); font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
button,input { font:inherit; }
button { color:inherit; cursor:pointer; }
main { width:min(100%,520px); min-height:100vh; margin:0 auto; background:#fbfaf6; padding-bottom:92px; box-shadow:0 0 40px rgba(25,35,28,.08); }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:24px 22px 16px; background:#fff; }
.eyebrow { margin:0 0 3px; color:var(--green); font-size:12px; font-weight:800; letter-spacing:.08em; }
h1 { margin:0; font-size:25px; letter-spacing:-.04em; }
.status { display:flex; align-items:center; gap:7px; padding:8px 11px; border-radius:999px; background:#f1efe7; color:#716f67; font-size:12px; font-weight:700; }
.status i { width:7px; height:7px; border-radius:50%; background:#d09b31; }
.status.connected { background:var(--green-soft); color:var(--green); }
.status.connected i { background:#2e9358; }
.hero { padding:22px; background:var(--green); color:white; border-radius:0 0 28px 28px; }
.hero p { margin:0 0 16px; color:#d9eadf; font-size:14px; }
.search { display:flex; align-items:center; gap:10px; height:52px; padding:0 16px; border-radius:15px; background:white; color:var(--ink); box-shadow:0 9px 24px rgba(7,37,20,.18); }
.search span { font-size:27px; transform:rotate(-15deg); }
.search input { min-width:0; flex:1; border:0; outline:0; font-size:15px; }
.search input::placeholder { color:#9a9e99; }
.notice { display:flex; justify-content:space-between; width:calc(100% - 44px); margin:16px 22px 0; padding:13px 15px; border:0; border-radius:12px; background:#fff1c9; color:#755814; text-align:left; font-size:13px; }
.content { padding:22px; }
.section-title { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.section-title h2 { margin:0; font-size:17px; letter-spacing:-.02em; }
.section-title span { color:var(--muted); font-size:12px; }
.product-list { display:grid; gap:9px; }
.product { display:flex; align-items:center; gap:12px; width:100%; padding:14px; border:1px solid var(--line); border-radius:15px; background:#fff; text-align:left; box-shadow:0 3px 9px rgba(28,37,30,.03); }
.product:active { transform:scale(.99); background:#f8faf7; }
.category { flex:0 0 45px; height:45px; display:grid; place-items:center; border-radius:12px; background:var(--green-soft); color:var(--green); font-size:11px; font-weight:800; }
.product-copy { min-width:0; flex:1; display:grid; gap:5px; }
.product-copy strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
.product-copy small,.movement small { color:var(--muted); font-size:11px; }
.stock { min-width:46px; text-align:right; }
.stock b { font-size:21px; }
.stock small { margin-left:2px; color:var(--muted); }
.stock.low b { color:#c36138; }
.empty { padding:45px 0; text-align:center; color:var(--muted); }
.recent { margin-top:28px; }
.movement { display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--line); }
.movement div { display:grid; gap:4px; }
.movement strong { font-size:13px; }
.check { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; background:var(--green-soft); color:var(--green); font-weight:900; }
.check.inbound { background:#e7f2e9; }
.bottom-nav { position:fixed; bottom:0; left:50%; z-index:10; display:flex; width:min(100%,520px); height:74px; transform:translateX(-50%); border-top:1px solid var(--line); background:rgba(255,255,255,.96); backdrop-filter:blur(12px); }
.bottom-nav button { flex:1; display:grid; place-items:center; gap:3px; border:0; background:none; color:#90938e; font-size:10px; }
.bottom-nav button span { font-size:21px; line-height:1; }
.bottom-nav .active { color:var(--green); font-weight:800; }
.sheet-backdrop { position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; background:rgba(12,20,14,.46); }
.sheet { width:min(100%,520px); padding:10px 22px 26px; border-radius:26px 26px 0 0; background:#fff; box-shadow:0 -10px 50px rgba(0,0,0,.2); }
.handle { width:42px; height:4px; margin:0 auto 18px; border-radius:3px; background:#d9d9d5; }
.sheet-head { display:flex; justify-content:space-between; gap:14px; }
.sheet-head p { margin:0 0 5px; color:var(--green); font-size:12px; font-weight:800; }
.sheet-head h2 { margin:0; font-size:20px; }
.sheet-head button { width:34px; height:34px; border:0; border-radius:50%; background:#f1f1ed; font-size:23px; }
.availability { display:flex; align-items:center; justify-content:space-between; margin:20px 0; padding:16px; border-radius:14px; background:var(--cream); }
.availability span { font-size:13px; color:var(--muted); }
.availability strong { color:var(--green); font-size:20px; }
.movement-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 18px; }
.movement-tabs button { min-height:48px; padding:8px; border:1px solid #d7d8d3; border-radius:12px; background:#fff; color:#777d77; font-size:12px; font-weight:800; }
.movement-tabs button.active { border-color:var(--green); background:var(--green-soft); color:var(--green); box-shadow:0 0 0 1px var(--green); }
.field { display:block; margin-top:16px; }
.field > span { display:block; margin-bottom:8px; font-size:13px; font-weight:800; }
.field input { width:100%; height:48px; padding:0 14px; border:1px solid #d7d8d3; border-radius:12px; outline:0; }
.field input:focus { border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
.stepper { display:flex; align-items:center; justify-content:space-between; height:50px; border:1px solid #d7d8d3; border-radius:12px; overflow:hidden; }
.stepper button { width:60px; height:100%; border:0; background:#f6f6f2; font-size:22px; }
.stepper strong { font-size:20px; }
.stepper input { width:100%; height:100%; min-width:0; flex:1; border:0; outline:0; text-align:center; font-size:20px; font-weight:800; background:transparent; }
.primary { width:100%; height:54px; margin-top:22px; border:0; border-radius:14px; background:var(--green); color:#fff; font-weight:800; }
.primary.inbound { background:#255f99; }
.primary:disabled { opacity:.5; }
.history { margin-top:22px; border-top:1px solid var(--line); padding-top:14px; }
.history-title { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.history-title h3 { margin:0; font-size:14px; }
.history-title span { color:var(--muted); font-size:11px; }
.history-scroll { max-height:200px; overflow-y:auto; }
.hrow { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #f0efe9; }
.hrow:last-child { border-bottom:0; }
.hbadge { flex:0 0 24px; height:24px; display:grid; place-items:center; border-radius:50%; font-weight:900; font-size:13px; background:var(--green-soft); color:var(--green); }
.hrow .hmeta { flex:1; min-width:0; display:grid; gap:2px; }
.hrow .hmeta small { color:var(--muted); font-size:10px; }
.hrow .hqty { font-size:13px; font-weight:800; white-space:nowrap; }
.history .empty { padding:22px 0; font-size:12px; }
.stock-list { display:grid; gap:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
.srow { display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid #f0efe9; }
.srow:last-child { border-bottom:0; }
.srow .sname { flex:1; min-width:0; display:grid; gap:3px; }
.srow .sname strong { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .sname small { color:var(--muted); font-size:11px; }
.srow .sqty { min-width:64px; text-align:right; font-weight:800; }
.srow .sqty b { font-size:19px; color:var(--green); }
.srow .sqty.low b { color:#c36138; }
.srow .sqty small { margin-left:2px; color:var(--muted); font-weight:400; }
@media (min-width:521px) { main { min-height:calc(100vh - 32px); margin-top:16px; border-radius:24px 24px 0 0; overflow:hidden; } }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div><p class="eyebrow">형제상사 · 외도창고</p><h1>재고 가져오기</h1></div>
    <span id="status" class="status connected"><i></i>서버 연결됨</span>
  </header>

  <section class="hero">
    <p>외도창고에서 노형점으로 가져갈 상품을 검색하세요.</p>
    <label class="search"><span>⌕</span><input id="search" placeholder="상품명 · 관리코드 · 바코드 검색" aria-label="상품 검색" /></label>
  </section>

  <button id="notice" class="notice" style="display:none" aria-label="알림 닫기"></button>

  <section class="content">
    <div class="section-title"><h2 id="listTitle">외도창고 상품</h2><span id="listCount">조회 중</span></div>
    <div id="productList" class="product-list"></div>
    <div id="recent"></div>
  </section>

  <section class="content" id="stockView" style="display:none">
    <div class="section-title"><h2>최종재고 현황</h2><span id="stockCount">조회 중</span></div>
    <div id="stockList" class="stock-list"></div>
  </section>

  <nav class="bottom-nav">
    <button id="navSearch" class="active"><span>⌕</span>상품 검색</button>
    <button id="navStock"><span>▤</span>최종재고</button>
    <button id="navSettings"><span>⚙</span>설정</button>
  </nav>
</main>

<div id="sheetRoot"></div>

<script>
const SUPABASE_URL = "https://rvlntxsrxlqymgjqhnxb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2bG50eHNyeGxxeW1nanFobnhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODczODUsImV4cCI6MjEwMTM2MzM4NX0.3psfGR-kjMVVvegNiFYrmWQVbF1rM3PRI_nxV5huDrU";
const headers = () => ({ apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" });

let products = [], selected = null, quantity = 1, movementType = "INBOUND", movements = [], loading = false, query = "";
let searchTimer = null;
let history = [], historyLoading = false;

const isInbound = (t) => String(t).startsWith("INBOUND");

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function setNotice(msg) {
  const el = $("notice");
  if (!msg) { el.style.display = "none"; return; }
  el.innerHTML = `${esc(msg)}<span>×</span>`;
  el.style.display = "flex";
}
$("notice").onclick = () => setNotice("");

async function loadProducts() {
  loading = true;
  renderList();
  const term = query.trim().replace(/[%,()]/g, "");
  // 검색어가 없으면 재고가 있는 상품만(서버 필터), 검색 시에는 전체 DB 대상
  const filter = term
    ? `&or=(product_name.ilike.*${encodeURIComponent(term)}*,product_code.ilike.*${encodeURIComponent(term)}*,barcode.ilike.*${encodeURIComponent(term)}*,search_keywords.ilike.*${encodeURIComponent(term)}*)`
    : "&warehouse_stock=gt.0";
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,product_code,product_name,unit,category,warehouse_stock&active=eq.true${filter}&order=product_name&limit=30`, { headers: headers() });
    if (!res.ok) throw new Error("상품을 불러오지 못했습니다.");
    products = await res.json();
    // 재고가 있는 상품을 최상단으로, 그 안에서는 가나다순
    products.sort((a, b) => {
      const ai = a.warehouse_stock > 0 ? 0 : 1, bi = b.warehouse_stock > 0 ? 0 : 1;
      if (ai !== bi) return ai - bi;
      return String(a.product_name).localeCompare(String(b.product_name), "ko");
    });
  } catch (e) {
    setNotice(e.message || "연결 오류가 발생했습니다.");
    products = [];
  } finally {
    loading = false;
    renderList();
  }
}

$("search").addEventListener("input", (e) => {
  query = e.target.value;
  $("listTitle").textContent = query ? "검색 결과" : "외도창고 상품";
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadProducts, 300);
});

/* ===== 최종재고 페이지 ===== */
let view = "search", stockItems = [], stockLoading = false;

function setView(v) {
  view = v;
  const search = v === "search";
  $("productList").parentElement.style.display = search ? "" : "none";
  document.querySelector(".hero").style.display = search ? "" : "none";
  $("stockView").style.display = v === "stock" ? "" : "none";
  $("navSearch").classList.toggle("active", search);
  $("navStock").classList.toggle("active", v === "stock");
  $("navSettings").classList.toggle("active", v === "settings");
  if (v === "stock") loadStock();
}

async function loadStock() {
  stockLoading = true; renderStock();
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,product_code,product_name,unit,category,warehouse_stock&active=eq.true&warehouse_stock=gt.0&order=product_name&limit=1000`, { headers: headers() });
    if (!res.ok) throw new Error("최종재고를 불러오지 못했습니다.");
    stockItems = await res.json();
    stockItems.sort((a, b) => String(a.product_name).localeCompare(String(b.product_name), "ko"));
  } catch (e) {
    setNotice(e.message || "연결 오류가 발생했습니다.");
    stockItems = [];
  } finally {
    stockLoading = false; renderStock();
  }
}

function renderStock() {
  $("stockCount").textContent = stockLoading ? "조회 중" : `${stockItems.length}개 품목`;
  const el = $("stockList");
  if (stockLoading) { el.innerHTML = `<div class="empty" style="padding:40px 0">불러오는 중…</div>`; return; }
  if (stockItems.length === 0) { el.innerHTML = `<div class="empty" style="padding:40px 0">재고가 있는 상품이 없습니다.</div>`; return; }
  el.innerHTML = stockItems.map((p) => `
    <button class="srow" data-id="${esc(p.id)}">
      <div class="sname"><strong>${esc(p.product_name)}</strong><small>${esc(p.product_code)} · ${esc(p.category ?? "기타")}</small></div>
      <span class="sqty ${p.warehouse_stock <= 3 ? "low" : ""}"><b>${p.warehouse_stock}</b><small>${esc(p.unit)}</small></span>
    </button>`).join("");
  el.querySelectorAll(".srow").forEach((btn) => {
    btn.onclick = () => openSheet(stockItems.find((p) => String(p.id) === btn.dataset.id));
  });
}

$("navSearch").onclick = () => setView("search");
$("navStock").onclick = () => setView("stock");
$("navSettings").onclick = () => setNotice("설정 기능은 준비 중입니다.");

function renderList() {
  $("listCount").textContent = loading ? "조회 중" : `${products.length}개 표시`;
  const list = $("productList");
  if (!loading && products.length === 0) {
    list.innerHTML = `<div class="empty">일치하는 상품이 없습니다.</div>`;
  } else {
    list.innerHTML = products.map((p) => `
      <button class="product" data-id="${esc(p.id)}">
        <span class="category">${esc(p.category ?? "기타")}</span>
        <span class="product-copy"><strong>${esc(p.product_name)}</strong><small>${esc(p.product_code)} · 단위 ${esc(p.unit)}</small></span>
        <span class="${p.warehouse_stock <= 3 ? "stock low" : "stock"}"><b>${p.warehouse_stock}</b><small>${esc(p.unit)}</small></span>
      </button>`).join("");
    list.querySelectorAll(".product").forEach((btn) => {
      btn.onclick = () => openSheet(products.find((p) => String(p.id) === btn.dataset.id));
    });
  }
  renderRecent();
}

function renderRecent() {
  const el = $("recent");
  if (movements.length === 0) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="recent"><div class="section-title"><h2>최근 기록</h2><span>이 기기</span></div>${
    movements.slice(0, 3).map((m) => `<div class="movement"><span class="${m.movement_type === "INBOUND" ? "check inbound" : "check"}">${m.movement_type === "INBOUND" ? "+" : "−"}</span><div><strong>${esc(m.product_name)}</strong><small>${m.movement_type === "INBOUND" ? "외도창고 입고" : "노형점 가져오기"} · ${esc(m.staff_name)} · ${m.quantity}개 · ${new Date(m.created_at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}</small></div></div>`).join("")
  }</div>`;
}

function openSheet(p) {
  if (!p) return;
  selected = p; quantity = 1; movementType = "INBOUND";
  renderSheet();
  loadHistory(p.id);
}

async function loadHistory(productId) {
  history = []; historyLoading = true;
  renderSheet();
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stock_movements?select=quantity,staff_name,movement_type,before_stock,after_stock,created_at&product_id=eq.${productId}&order=created_at.desc&limit=50`, { headers: headers() });
    if (!res.ok) throw new Error();
    history = await res.json();
  } catch (e) {
    history = [];
  } finally {
    historyLoading = false;
    if (selected && String(selected.id) === String(productId)) renderSheet();
  }
}

function historyHTML() {
  let rows;
  if (historyLoading) {
    rows = `<div class="empty">이동기록 조회 중…</div>`;
  } else if (history.length === 0) {
    rows = `<div class="empty">이동기록이 없습니다.</div>`;
  } else {
    rows = history.map((m) => {
      const inb = isInbound(m.movement_type);
      const d = new Date(m.created_at);
      const when = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} ${d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}`;
      return `<div class="hrow">
        <span class="hbadge" style="${inb ? "" : "background:#fbe7dd;color:#c36138"}">${inb ? "+" : "−"}</span>
        <div class="hmeta"><strong>${inb ? "외도창고 입고" : "노형점 가져오기"}</strong><small>${esc(m.staff_name)} · ${when} · 재고 ${m.before_stock}→${m.after_stock}</small></div>
        <span class="hqty" style="color:${inb ? "var(--green)" : "#c36138"}">${inb ? "+" : "−"}${m.quantity}</span>
      </div>`;
    }).join("");
  }
  return `<div class="history"><div class="history-title"><h3>이동기록</h3><span>${historyLoading ? "" : history.length + "건"}</span></div><div class="history-scroll">${rows}</div></div>`;
}
function closeSheet() { selected = null; renderSheet(); }

function renderSheet() {
  const root = $("sheetRoot");
  if (!selected) { root.innerHTML = ""; return; }
  const s = selected;
  const overStock = movementType === "OUTBOUND" && quantity > s.warehouse_stock;
  root.innerHTML = `
  <div class="sheet-backdrop" id="backdrop"><form class="sheet" id="sheet">
    <div class="handle"></div>
    <div class="sheet-head"><div><p>${esc(s.product_code)}</p><h2>${esc(s.product_name)}</h2></div><button type="button" id="closeBtn" aria-label="닫기">×</button></div>
    <div class="availability"><span>외도창고 현재고</span><strong>${s.warehouse_stock}${esc(s.unit)}</strong></div>
    <div class="movement-tabs" role="group" aria-label="재고 처리 유형">
      <button type="button" id="tabIn" class="${movementType === "INBOUND" ? "active" : ""}">＋ 외도창고 입고</button>
      <button type="button" id="tabOut" class="${movementType === "OUTBOUND" ? "active" : ""}">− 노형점 가져오기</button>
    </div>
    <label class="field"><span>담당자</span><input id="staff" placeholder="이름 입력" required /></label>
    <div class="field"><span>${movementType === "INBOUND" ? "입고 수량" : "가져올 수량"}</span><div class="stepper"><button type="button" id="minus">−</button><input id="qtyInput" type="number" inputmode="numeric" pattern="[0-9]*" min="1" value="${quantity}" /><button type="button" id="plus">＋</button></div></div>
    <button class="primary ${movementType === "INBOUND" ? "inbound" : ""}" id="submitBtn" ${loading || overStock ? "disabled" : ""}>${loading ? "처리 중…" : movementType === "INBOUND" ? `외도창고에 ${quantity}${esc(s.unit)} 입고` : `노형점으로 ${quantity}${esc(s.unit)} 가져오기`}</button>
    ${historyHTML()}
  </form></div>`;

  const staffVal = root._staff || "";
  $("staff").value = staffVal;
  $("staff").oninput = (e) => { root._staff = e.target.value; };
  $("backdrop").onclick = closeSheet;
  $("sheet").onclick = (e) => e.stopPropagation();
  $("closeBtn").onclick = closeSheet;
  $("tabIn").onclick = () => { movementType = "INBOUND"; renderSheet(); };
  $("tabOut").onclick = () => { movementType = "OUTBOUND"; quantity = Math.min(quantity, s.warehouse_stock || 1); renderSheet(); };
  $("minus").onclick = () => { quantity = Math.max(1, quantity - 1); renderSheet(); };
  $("plus").onclick = () => { quantity = movementType === "INBOUND" ? quantity + 1 : Math.min(s.warehouse_stock, quantity + 1); renderSheet(); };
  const qi = $("qtyInput");
  // 직접 입력 시에는 포커스 유지를 위해 전체 재렌더 없이 값만 갱신
  qi.oninput = () => {
    let v = parseInt(qi.value.replace(/[^0-9]/g, ""), 10);
    if (isNaN(v)) return; // 입력 도중 빈칸 허용
    if (movementType === "OUTBOUND") v = Math.min(v, s.warehouse_stock);
    quantity = Math.max(1, v);
    const over = movementType === "OUTBOUND" && quantity > s.warehouse_stock;
    const sb = $("submitBtn");
    sb.disabled = loading || over;
    sb.textContent = loading ? "처리 중…" : movementType === "INBOUND" ? `외도창고에 ${quantity}${s.unit} 입고` : `노형점으로 ${quantity}${s.unit} 가져오기`;
  };
  qi.onblur = () => { if (!qi.value || parseInt(qi.value, 10) < 1) { quantity = 1; renderSheet(); } };
  qi.onfocus = () => qi.select();
  $("sheet").onsubmit = submitMovement;
}

async function submitMovement(e) {
  e.preventDefault();
  const staff = ($("sheetRoot")._staff || "").trim();
  if (!selected || !staff || quantity < 1) return;
  loading = true; renderSheet();
  try {
    const rpc = movementType === "INBOUND" ? "receive_to_warehouse" : "take_from_warehouse";
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${rpc}`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ p_product_id: selected.id, p_quantity: quantity, p_staff_name: staff }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body?.message ?? "등록에 실패했습니다.");
    movements.unshift({ product_name: selected.product_name, quantity, staff_name: staff, created_at: new Date().toISOString(), movement_type: movementType });
    setNotice(`${selected.product_name} ${quantity}${selected.unit} ${movementType === "INBOUND" ? "입고" : "가져오기"} 완료`);
    selected = null;
    query = ""; $("search").value = ""; $("listTitle").textContent = "외도창고 상품";
    await loadProducts();
    if (view === "stock") loadStock();
  } catch (err) {
    setNotice(err.message || "등록 오류가 발생했습니다.");
  } finally {
    loading = false;
    renderSheet();
  }
}

loadProducts();
</script>
</body>
